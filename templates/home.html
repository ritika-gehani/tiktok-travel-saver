<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Saver</title>
<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --ink: #2f2e2b;
    --ink-2: #6f6c66;
    --ink-3: #a19d95;
    --line: #ebe8e1;
    --accent: #e5533d;
    --accent-soft: #fdece8;
    --shadow: 0 1px 2px rgba(60, 50, 30, 0.04), 0 8px 24px -12px rgba(60, 50, 30, 0.18);
    --shadow-hover: 0 2px 4px rgba(60, 50, 30, 0.05), 0 18px 36px -14px rgba(60, 50, 30, 0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 32px; background: rgba(251, 250, 247, 0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, #ffd9a8, #ffb0a0); font-size: 15px;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s, transform .15s, box-shadow .15s;
  }
  .btn:hover { background: #f5f3ee; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #111; transform: translateY(-1px); box-shadow: var(--shadow); }

  /* Hero */
  .container { max-width: 1040px; margin: 0 auto; padding: 56px 32px 96px; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: 36px; }
  .eyebrow { font-size: 13px; color: var(--ink-3); letter-spacing: .02em; margin-bottom: 10px; }
  h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 700; }
  .lede { margin-top: 12px; color: var(--ink-2); font-size: 16px; max-width: 480px; line-height: 1.5; }
  .stats { display: flex; gap: 28px; flex-shrink: 0; padding-bottom: 6px; }
  .stat { text-align: right; }
  .stat b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .stat span { font-size: 12px; color: var(--ink-3); }

  /* Search */
  .search {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px; margin-bottom: 44px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    transition: box-shadow .15s, border-color .15s;
  }
  .search:focus-within { border-color: #d9d5cb; box-shadow: var(--shadow-hover); }
  .search svg { width: 18px; height: 18px; color: var(--ink-3); flex-shrink: 0; }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--ink); }
  .search input::placeholder { color: var(--ink-3); }
  .search kbd {
    font: 11px/1 -apple-system, sans-serif; color: var(--ink-3); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 6px; background: #faf8f3;
  }

  /* Sections */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .section-head h2 { font-size: 18px; font-weight: 600; }
  .section-head span { font-size: 13px; color: var(--ink-3); }

  /* Trip blocks */
  .trip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 56px; }
  .trip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s, border-color .2s;
  }
  .trip:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: #e2ded4; }
  .trip-cover { height: 120px; position: relative; display: flex; align-items: flex-end; padding: 14px 18px; }
  .trip-cover .flag { font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.12)); }
  .trip-cover .review-pill {
    position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,.85); color: var(--accent); border-radius: 999px; padding: 4px 9px;
  }
  .trip-body { padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .trip-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .trip-sub { font-size: 13px; color: var(--ink-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: #f4f2ec; color: var(--ink-2); }
  .trip-foot { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); }
  .trip-foot b { color: var(--ink); font-weight: 600; }
  .trip.add {
    border-style: dashed; background: transparent; box-shadow: none; align-items: center; justify-content: center;
    min-height: 200px; color: var(--ink-3); gap: 10px; text-align: center; padding: 24px;
  }
  .trip.add:hover { background: var(--surface); color: var(--ink); }
  .trip.add .plus { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; background: var(--accent-soft); color: var(--accent); }
  .trip.add strong { font-size: 15px; font-weight: 600; color: var(--ink); }
  .trip.add small { font-size: 13px; }

  /* Recently saved */
  .recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .save {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px; transition: transform .15s, box-shadow .15s;
  }
  .save:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .save-where { font-size: 12px; color: var(--ink-3); }
  .save-topic { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .save-meta { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-3); font-size: 15px; }
  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .container { padding: 36px 20px 72px; }
    .hero { flex-direction: column; align-items: flex-start; gap: 20px; }
    .stats { gap: 20px; } .stat { text-align: left; }
    h1 { font-size: 32px; }
    .topbar { padding: 12px 20px; }
  }
</style>
</head>
<body>
<nav class="topbar">
  <a href="/" class="brand"><span class="brand-mark">🧭</span> Travel Saver</a>
  <div class="topbar-actions">
    <a href="/add" class="btn primary">＋ Save a TikTok</a>
  </div>
</nav>

<main class="container">
  <section class="hero">
    <div>
      <div class="eyebrow" id="greeting">Your trips</div>
      <h1>Where to next?</h1>
      <p class="lede">Every TikTok you saved, sorted into trips. Open a country to see the cities, places and tips you've collected.</p>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search trips, cities, places…" autocomplete="off">
    <kbd>/</kbd>
  </label>

  <div class="section-head"><h2>Trips</h2><span id="tripCount"></span></div>
  <div id="tripGrid" class="trip-grid"></div>
  <div id="emptyState" class="empty hidden">Nothing matches that search.</div>

  <section id="recentSection">
    <div class="section-head"><h2>Recently saved</h2><span>Newest first</span></div>
    <div id="recent" class="recent"></div>
  </section>
</main>

<script>
const LIBRARY_DATA = {{DATA_JSON}};

const FLAGS = {
  'Japan':'🇯🇵','Portugal':'🇵🇹','Mexico':'🇲🇽','Spain':'🇪🇸','Italy':'🇮🇹','France':'🇫🇷','Greece':'🇬🇷',
  'Thailand':'🇹🇭','Vietnam':'🇻🇳','Indonesia':'🇮🇩','South Korea':'🇰🇷','Korea':'🇰🇷','Taiwan':'🇹🇼',
  'United States':'🇺🇸','USA':'🇺🇸','United Kingdom':'🇬🇧','UK':'🇬🇧','Ireland':'🇮🇪','Germany':'🇩🇪',
  'Netherlands':'🇳🇱','Switzerland':'🇨🇭','Austria':'🇦🇹','Czech Republic':'🇨🇿','Czechia':'🇨🇿','Croatia':'🇭🇷',
  'Turkey':'🇹🇷','Türkiye':'🇹🇷','Morocco':'🇲🇦','Egypt':'🇪🇬','South Africa':'🇿🇦','Kenya':'🇰🇪',
  'India':'🇮🇳','Sri Lanka':'🇱🇰','Nepal':'🇳🇵','Australia':'🇦🇺','New Zealand':'🇳🇿','Canada':'🇨🇦',
  'Brazil':'🇧🇷','Argentina':'🇦🇷','Peru':'🇵🇪','Colombia':'🇨🇴','Chile':'🇨🇱','Costa Rica':'🇨🇷',
  'Iceland':'🇮🇸','Norway':'🇳🇴','Sweden':'🇸🇪','Denmark':'🇩🇰','Finland':'🇫🇮','Singapore':'🇸🇬',
  'Malaysia':'🇲🇾','Philippines':'🇵🇭','China':'🇨🇳','Hong Kong':'🇭🇰','United Arab Emirates':'🇦🇪','UAE':'🇦🇪',
};
const COVERS = [
  'linear-gradient(135deg,#ffe4c7,#ffb99a)',
  'linear-gradient(135deg,#d7ecff,#a9c9ff)',
  'linear-gradient(135deg,#e2f5d8,#a8d8a0)',
  'linear-gradient(135deg,#fde2ef,#f4a9c8)',
  'linear-gradient(135deg,#efe3ff,#c9b3f5)',
  'linear-gradient(135deg,#fff3c4,#ffd76a)',
  'linear-gradient(135deg,#d9f4f1,#93d8cf)',
];
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, one, many) => n === 1 ? `1 ${one}` : `${n} ${many}`;

function groupTrips(tiktoks) {
  const groups = {};
  for (const t of tiktoks) {
    const g = groups[t.country] ??= { country: t.country, cities: new Map(), saves: 0, places: 0, review: 0, latest: '' };
    g.cities.set(t.city, (g.cities.get(t.city) || 0) + 1);
    g.saves++;
    g.places += (t.places || []).length;
    if (t.status === 'needs_review') g.review++;
    if ((t.created_at || '') > g.latest) g.latest = t.created_at || '';
  }
  return Object.values(groups).sort((a, b) => b.latest.localeCompare(a.latest));
}

function tripCard(g) {
  const url = '/country/' + encodeURIComponent(g.country);
  const cities = [...g.cities.keys()];
  const shown = cities.slice(0, 4);
  const more = cities.length - shown.length;
  return `<a href="${url}" class="trip" data-search="${esc((g.country + ' ' + cities.join(' ')).toLowerCase())}">
    <div class="trip-cover" style="background:${COVERS[hash(g.country) % COVERS.length]}">
      <span class="flag">${FLAGS[g.country] || '🌍'}</span>
      ${g.review ? `<span class="review-pill">${plural(g.review, 'to review', 'to review')}</span>` : ''}
    </div>
    <div class="trip-body">
      <div class="trip-title">${esc(g.country)}</div>
      <div class="trip-sub">${plural(cities.length, 'city', 'cities')} · ${plural(g.saves, 'TikTok', 'TikToks')}</div>
      <div class="chips">${shown.map(c => `<span class="chip">${esc(c)}</span>`).join('')}${more > 0 ? `<span class="chip">+${more}</span>` : ''}</div>
      <div class="trip-foot"><span><b>${g.places}</b> places</span><span>Open trip →</span></div>
    </div>
  </a>`;
}

function saveCard(t) {
  const topic = (t.video_summary && t.video_summary.main_topic) || 'Untitled TikTok';
  const places = (t.places || []).length;
  const author = (t.author || '').replace(/^@+/, '');
  return `<a href="/tiktok/${encodeURIComponent(t.id)}" class="save" data-search="${esc((topic + ' ' + t.city + ' ' + t.country + ' ' + (t.places || []).map(p => p.name).join(' ')).toLowerCase())}">
    <div class="save-where">${FLAGS[t.country] || '🌍'} ${esc(t.city)}, ${esc(t.country)}</div>
    <div class="save-topic">${esc(topic)}</div>
    <div class="save-meta">${author ? `@${esc(author)}` : ''} ${author && places ? '<span class="dot"></span>' : ''} ${places ? plural(places, 'place', 'places') : ''}</div>
  </a>`;
}

function render() {
  const tiktoks = LIBRARY_DATA.tiktoks || [];
  const trips = groupTrips(tiktoks);
  const cities = new Set(tiktoks.map(t => t.city)).size;
  const places = tiktoks.reduce((n, t) => n + (t.places || []).length, 0);

  const hour = new Date().getHours();
  document.getElementById('greeting').textContent =
    hour < 12 ? 'Good morning ☀️' : hour < 18 ? 'Good afternoon 🌤' : 'Good evening 🌙';

  document.getElementById('stats').innerHTML = [
    [trips.length, 'trips'], [cities, 'cities'], [tiktoks.length, 'saves'], [places, 'places'],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

  document.getElementById('tripCount').textContent = plural(trips.length, 'country', 'countries');
  document.getElementById('tripGrid').innerHTML = trips.map(tripCard).join('') +
    `<a href="/add" class="trip add" data-search=""><span class="plus">＋</span><strong>Start a new trip</strong><small>Paste a TikTok and we'll file it under its city.</small></a>`;

  const recent = [...tiktoks].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '')).slice(0, 6);
  document.getElementById('recent').innerHTML = recent.map(saveCard).join('');
  document.getElementById('recentSection').classList.toggle('hidden', recent.length === 0);
}

function applySearch(q) {
  q = q.trim().toLowerCase();
  let visible = 0;
  for (const el of document.querySelectorAll('[data-search]')) {
    const isAdd = el.classList.contains('add');
    const show = !q ? true : (!isAdd && el.dataset.search.includes(q));
    el.classList.toggle('hidden', !show);
    if (show && !isAdd && el.classList.contains('trip')) visible++;
  }
  document.getElementById('emptyState').classList.toggle('hidden', !q || visible > 0);
  document.getElementById('tripCount').textContent = plural(visible, 'country', 'countries');
  document.getElementById('recentSection').classList.toggle('hidden', !!q && !document.querySelector('.save:not(.hidden)'));
}

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', e => applySearch(e.target.value));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
  if (e.key === 'Escape' && document.activeElement === searchEl) { searchEl.value = ''; applySearch(''); searchEl.blur(); }
});
render();
</script>
</body>
</html>
