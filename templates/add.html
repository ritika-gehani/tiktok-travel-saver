<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save a TikTok — Travel Saver</title>
<style>
{{BASE_CSS}}
  .head { margin-bottom: 28px; }
  .head h1 { font-size: 30px; }
  .head .eyebrow { display: flex; align-items: center; gap: 8px; }

  /* Paste box */
  .paste {
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; margin-bottom: 28px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    transition: box-shadow .15s, border-color .15s;
  }
  .paste:focus-within { border-color: var(--line-strong); box-shadow: var(--shadow-hover); }
  .paste input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--ink); min-width: 0; }
  .paste input::placeholder { color: var(--ink-3); }
  .paste .btn { padding: 11px 18px; border-radius: 11px; }

  /* Progress */
  .progress { display: none; margin-bottom: 20px; }
  .progress-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s ease; width: 0%; }
  .step-label { font-size: 13px; color: var(--ink-2); margin-top: 10px; display: flex; justify-content: space-between; }
  .step-label b { font-weight: 500; color: var(--ink); }

  /* Log */
  details.log { display: none; margin-bottom: 28px; }
  details.log summary { cursor: pointer; font-size: 13px; color: var(--ink-3); list-style: none; }
  details.log summary::before { content: '▸ '; }
  details.log[open] summary::before { content: '▾ '; }
  .log-box {
    margin-top: 10px; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; max-height: 260px; overflow-y: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--ink-2);
  }
  .log-line.step { color: var(--ink); font-weight: 600; margin-top: 6px; }
  .log-line.warn { color: var(--warn); }
  .log-line.error { color: var(--accent); }
  .log-line.done { color: var(--ok); font-weight: 600; }

  .results { display: none; }

  /* Save bar */
  .save-bar {
    display: none; position: sticky; bottom: 16px; z-index: 20; align-items: center; gap: 16px; margin-top: 8px;
    padding: 14px 18px; background: var(--ink); color: #fff; border-radius: 14px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.5);
  }
  .save-bar span { flex: 1; font-size: 14px; }
  .save-bar .btn { border-color: transparent; }
  .save-bar .btn.accent { background: var(--accent); }
  .save-bar .btn.quiet { color: rgba(255,255,255,.75); }
  .save-bar .btn.quiet:hover { background: rgba(255,255,255,.1); color: #fff; }

  .notice { padding: 14px 18px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; margin-bottom: 20px; display: none; }
</style>
</head>
<body>
<nav class="topbar">
  <div class="crumbs" id="crumbs"><a href="/" class="brand"><span class="brand-mark">🧭</span> Travel Saver</a></div>
  <div class="topbar-actions"><a href="/" class="btn" id="backBtn">Cancel</a></div>
</nav>

<main class="container narrow">
  <div class="head">
    <div class="eyebrow" id="eyebrow">Save a TikTok</div>
    <h1 id="title">Paste a TikTok</h1>
    <p class="lede" id="lede">We read the caption, listen to the audio and scan the on-screen text, then pull out every place the creator recommends.</p>
  </div>

  <form class="paste" id="pasteForm">
    <input type="url" id="urlInput" placeholder="https://www.tiktok.com/@user/video/123…" autocomplete="off" spellcheck="false">
    <button type="submit" class="btn primary" id="goBtn">Extract places</button>
  </form>

  <div class="progress" id="progressContainer">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="step-label"><b id="stepLabel">Starting…</b><span id="stepCount"></span></div>
  </div>

  <div class="notice" id="notice"></div>

  <details class="log" id="logDetails">
    <summary>Show the extraction log</summary>
    <div class="log-box" id="logBox"></div>
  </details>

  <div class="results" id="results"></div>

  <div class="save-bar" id="saveBar">
    <span id="saveText">Looks right? Save it to your trip.</span>
    <a href="/" class="btn quiet" id="discardBtn">Discard</a>
    <button class="btn accent" id="saveBtn" type="button">Save</button>
  </div>
</main>

<script>
{{RESULTS_JS}}
const TRIP = {{TRIP_JSON}};

const STEP_NAMES = {
  1: 'Fetching caption', 2: 'Downloading video', 3: 'Transcribing audio', 4: 'Extracting video frames',
  5: 'Reading on-screen text', 6: 'Combining sources', 7: 'Extracting places with AI', 8: 'Done',
};

let pollTimer = null, lastLogCount = 0;
let _currentUrl = '', _lastResult = null, _lastTranscript = '', _lastScreenText = '';
const $ = id => document.getElementById(id);

function setupTripContext() {
  if (!TRIP) return;
  const tripHref = '/trip/' + encodeURIComponent(TRIP.id);
  $('crumbs').insertAdjacentHTML('beforeend', `<span>/</span><a href="${tripHref}">${escapeHtml(TRIP.city)}</a><span>/</span><b>Save a TikTok</b>`);
  $('backBtn').href = tripHref;
  $('eyebrow').innerHTML = `<span>${escapeHtml(TRIP.flag || '')}</span><span>${escapeHtml(TRIP.city)}, ${escapeHtml(TRIP.country)}</span>`;
  $('title').textContent = `Add a TikTok to ${TRIP.city}`;
  $('saveText').textContent = `Looks right? Save it to ${TRIP.city}.`;
  $('saveBtn').textContent = `Save to ${TRIP.city}`;
  $('discardBtn').href = tripHref;
}

function startPipeline(url) {
  _currentUrl = url;
  _lastResult = null;
  $('goBtn').disabled = true;
  $('progressContainer').style.display = 'block';
  $('logDetails').style.display = 'block';
  $('logBox').innerHTML = '';
  $('results').style.display = 'none';
  $('results').innerHTML = '';
  $('saveBar').style.display = 'none';
  $('notice').style.display = 'none';
  lastLogCount = 0;
  fetch('/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
  pollTimer = setInterval(pollStatus, 800);
}

function pollStatus() {
  fetch('/status').then(r => r.json()).then(data => {
    const pct = Math.round((data.current_step / data.total_steps) * 100);
    $('progressFill').style.width = pct + '%';
    $('stepLabel').textContent = STEP_NAMES[data.current_step] || 'Starting…';
    $('stepCount').textContent = `Step ${data.current_step} of ${data.total_steps}`;

    const logBox = $('logBox');
    for (let i = lastLogCount; i < data.logs.length; i++) {
      const line = document.createElement('div');
      line.className = 'log-line';
      const msg = data.logs[i];
      if (msg.startsWith('⚠️') || msg.startsWith('⚠')) line.className += ' warn';
      else if (msg.startsWith('❌')) line.className += ' error';
      else if (msg === 'Done!') line.className += ' done';
      else if (msg.match(/^(Fetching|Downloading|Transcribing|Extracting|Reading|Combining|Sending)/)) line.className += ' step';
      line.textContent = msg;
      logBox.appendChild(line);
    }
    lastLogCount = data.logs.length;
    logBox.scrollTop = logBox.scrollHeight;

    if (!data.running) {
      clearInterval(pollTimer);
      $('goBtn').disabled = false;
      if (data.result) {
        _lastResult = data.result;
        _lastTranscript = data.transcript || '';
        _lastScreenText = data.screen_text || '';
        $('results').style.display = 'block';
        renderExtraction($('results'), data.result, _lastTranscript, _lastScreenText);
        $('saveBar').style.display = 'flex';
      }
      if (data.error) {
        $('stepLabel').textContent = 'Extraction failed';
        $('notice').textContent = data.error;
        $('notice').style.display = 'block';
        $('logDetails').open = true;
      }
    }
  });
}

function saveToLibrary() {
  const btn = $('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  fetch('/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: _currentUrl, trip_id: TRIP ? TRIP.id : '', result: _lastResult, transcript: _lastTranscript, screen_text: _lastScreenText }),
  }).then(r => r.json()).then(data => {
    if (data.ok) {
      btn.textContent = 'Saved ✓';
      setTimeout(() => { window.location.href = data.trip_id ? '/trip/' + encodeURIComponent(data.trip_id) : '/'; }, 700);
    } else {
      btn.textContent = 'Try again';
      btn.disabled = false;
      $('notice').textContent = data.error || 'Could not save.';
      $('notice').style.display = 'block';
    }
  }).catch(err => {
    btn.textContent = 'Try again';
    btn.disabled = false;
    $('notice').textContent = String(err);
    $('notice').style.display = 'block';
  });
}

$('pasteForm').addEventListener('submit', e => {
  e.preventDefault();
  const url = $('urlInput').value.trim();
  if (!url) { $('urlInput').focus(); return; }
  startPipeline(url);
});
$('saveBtn').addEventListener('click', saveToLibrary);

setupTripContext();
const initialUrl = new URLSearchParams(location.search).get('url');
if (initialUrl) { $('urlInput').value = initialUrl; startPipeline(initialUrl); }
else $('urlInput').focus();
</script>
</body>
</html>
