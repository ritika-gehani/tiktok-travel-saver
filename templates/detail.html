<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok — Travel Saver</title>
<style>
{{BASE_CSS}}
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
  .head .eyebrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .head h1 { font-size: 30px; }
  .status { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
  .status.needs_review { background: var(--accent-soft); color: var(--accent); }
  .status.reviewed { background: var(--ok-soft); color: var(--ok); }
  .source { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
  .source a { color: var(--ink); border-bottom: 1px solid var(--line-strong); }
  .source a:hover { border-color: var(--ink); }
</style>
</head>
<body>
<nav class="topbar">
  <div class="crumbs"><a href="/" class="brand"><span class="brand-mark">🧭</span> Travel Saver</a><span>/</span><a href="{{BACK_HREF_ATTR}}">{{CITY_NAME}}</a><span>/</span><b id="crumbTopic"></b></div>
  <div class="topbar-actions">
    <a href="/how-it-works#labels" class="btn quiet">What do these labels mean?</a>
    <a href="{{BACK_HREF_ATTR}}" class="btn">← Back to {{CITY_NAME}}</a>
  </div>
</nav>

<main class="container narrow">
  <div class="head">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="source" id="source"></div>
    </div>
  </div>
  <div id="results"></div>
</main>

<script>
const LABELS = {{LABELS_JSON}};
{{RESULTS_JS}}
const TIKTOK = {{DATA_JSON}};

const topic = (TIKTOK.video_summary && TIKTOK.video_summary.main_topic) || 'Untitled TikTok';
const author = (TIKTOK.author || '').replace(/^@+/, '');
const saved = TIKTOK.created_at ? new Date(TIKTOK.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
document.title = `${topic} — Travel Saver`;
document.getElementById('crumbTopic').textContent = topic;
document.getElementById('title').textContent = topic;
document.getElementById('eyebrow').innerHTML =
  `<span class="status ${escapeHtml(TIKTOK.status)}">${TIKTOK.status === 'needs_review' ? 'Needs review' : 'Reviewed'}</span>` +
  `<span>${escapeHtml(TIKTOK.city)}, ${escapeHtml(TIKTOK.country)}${saved ? ' · saved ' + saved : ''}</span>`;
const safeUrl = /^https?:\/\//i.test(TIKTOK.url || '') ? TIKTOK.url : '';
document.getElementById('source').innerHTML =
  `${author ? `<span>@${escapeHtml(author)}</span>` : ''}${author && safeUrl ? '<span>·</span>' : ''}` +
  (safeUrl ? `<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener">Open on TikTok ↗</a>` : '');

renderExtraction(document.getElementById('results'), TIKTOK, TIKTOK.transcript || '', TIKTOK.screen_text || '');
</script>
</body>
</html>
